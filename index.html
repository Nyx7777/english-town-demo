<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>English Town</title>
<style>
  :root{--ink:#4a3a2e;--cream:#fffaf0;--red:#e8674f;--green:#58b56b;--sun:#ffc94d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe8f7;color:var(--ink);font-family:"Arial Rounded MT Bold","Nunito","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none}
  #ui>*{pointer-events:auto}
  .pill{background:#fffaf0f0;border-radius:999px;box-shadow:0 3px 0 #0000001a;padding:7px 14px;font-size:15px}
  #hud{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:60vw}
  #hud b{font-size:17px}
  .coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:#ffc94d;border:2px solid #d9a52e;margin-right:6px;vertical-align:-2px}
  #menu{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:38vw}
  #menu button{font-size:12px;padding:6px 11px;opacity:.9}
  .tag{position:absolute;transform:translate(-50%,-100%);background:var(--cream);border-radius:999px;padding:3px 11px;font-size:13px;box-shadow:0 2px 0 #0000001f;white-space:nowrap;cursor:pointer}
  .hearts{color:var(--red);font-size:12px;letter-spacing:1px}.hearts i{color:#e3d6c4;font-style:normal}
  .tag.goal:before{content:"!";display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--red);color:#fff;text-align:center;margin-right:6px;font-size:13px;animation:bob .9s infinite alternate ease-in-out}
  @keyframes bob{to{transform:translateY(-4px)}}
  #talk{position:absolute;transform:translate(-50%,-100%);background:var(--green);color:#fff;border-radius:999px;padding:11px 20px 11px 16px;font-size:17px;box-shadow:0 5px 0 #3d8a4d;white-space:nowrap;display:none;align-items:center;gap:8px}
  #talk.on{display:flex;animation:talkin .22s ease-out}
  @keyframes talkin{from{opacity:0;transform:translate(-50%,-100%) scale(.7)}}
  #talk:active{box-shadow:0 2px 0 #3d8a4d}
  #talk svg{flex:none}
  #talk kbd{font:inherit;font-size:11px;background:#ffffff40;border-radius:6px;padding:1px 6px;margin-left:2px}
  #talk:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--green);border-bottom:0}
  @media (hover:none){#talk kbd{display:none}}
  .fly{position:absolute;left:0;top:0;margin:-12px 0 0 -12px;font-size:24px;line-height:1;pointer-events:none!important;z-index:5}
  .fly .coin{width:22px;height:22px;margin:0}
  .fly-h{color:var(--red);font-size:30px;text-shadow:0 2px 0 #fff}
  #toast{white-space:pre-line;line-height:1.5;position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);background:#fff;border-radius:22px;padding:14px 22px;font-size:18px;box-shadow:0 5px 0 #0000001f;opacity:0;transition:.25s;text-align:center;max-width:86vw;pointer-events:none!important}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #note{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#4a3a2ecc;color:#fff;border-radius:999px;padding:7px 16px;font-size:12px;white-space:nowrap;pointer-events:none!important}

  /* —— 对话层 —— */
  #dlg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,620px);padding:10px 12px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}
  #dlg[hidden]{display:none}
  .npcbox{position:relative;background:var(--cream);border-radius:24px;padding:14px 18px 10px;box-shadow:0 5px 0 #00000022}
  .npcbox .who{position:absolute;left:18px;top:-13px;background:var(--red);color:#fff;border-radius:999px;padding:3px 13px;font-size:14px}
  .npcbox .line{font-size:23px;line-height:1.3;min-height:30px;margin-top:4px}
  .npcbox .zh{font-size:15px;color:#8a7767;margin-top:4px}
  .npcbox .tools{display:flex;gap:8px;margin-top:9px}
  .npcbox .tools button{background:#f1e7d3;border-radius:999px;padding:6px 13px;font-size:13px}
  .npcbox .tools button.on{background:#ffe3a3}
  .npcbox .x{position:absolute;right:10px;top:8px;width:30px;height:30px;border-radius:50%;background:#f1e7d3;font-size:18px;line-height:1}
  .tip{align-self:center;background:#4a3a2ecc;color:#fff;border-radius:999px;padding:3px 13px;font-size:12px}
  .cards{display:flex;flex-direction:column;gap:8px}
  .card,.picked{background:#fff;border-radius:18px;padding:12px 16px;text-align:left;box-shadow:0 4px 0 #0000001f;border:3px solid transparent;display:flex;flex-direction:column;gap:3px;position:relative}
  .card:active{transform:translateY(2px);box-shadow:0 2px 0 #0000001f}
  .card .en,.picked .en{font-size:20px;line-height:1.3}
  .card{padding-right:64px}
  .card .cst{position:absolute;right:12px;top:9px;font-size:14px;letter-spacing:1px;color:var(--sun);text-shadow:0 1px 0 #d9a52e}.card .cst i{color:#e3d6c4;font-style:normal;text-shadow:none}
  .card .cst.new{color:#fff;background:var(--green);border-radius:999px;padding:1px 8px;font-size:12px;letter-spacing:0;text-shadow:none}
  .card.almost{border-color:#ffd65a;animation:almost 1.3s infinite alternate ease-in-out}
  .card .cal{font-size:12px;color:#c98a12}
  .card.hasic{padding-left:62px}.card .cic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:30px;line-height:1}
  @keyframes almost{to{box-shadow:0 4px 0 #0000001f,0 0 16px 4px #ffd65aaa}}
  .czh{font-size:14px;color:#8a7767}
  .picked{border-color:var(--sun);text-align:center;align-items:center}
  .picked .en{font-size:23px}
  .picked .weak{color:#e8862f;text-decoration:underline wavy #e8862f;text-underline-offset:5px}
  .picked.retry{animation:shake .35s}
  .picked.pass{border-color:var(--green);background:#edfbe9}
  .picked .star{position:absolute;right:12px;top:-16px;font-size:34px;color:var(--sun);text-shadow:0 2px 0 #d9a52e;animation:pop .4s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes pop{from{transform:scale(0) rotate(-40deg)}}
  .act{display:flex;justify-content:center;align-items:center;gap:22px;min-height:76px}
  .mic{width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 6px 0 #b9462f;display:grid;place-items:center}
  .mic.rec{background:#ff3d2e;transform:translateY(4px) scale(1.08);box-shadow:0 2px 0 #b9462f,0 0 0 calc(8px + var(--lv,0) * 26px) #ff3d2e33}
  .side{width:62px;height:62px;border-radius:50%;background:var(--cream);box-shadow:0 4px 0 #0000001f;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
  .side small{font-size:10px}
  .big{background:var(--green);color:#fff;border-radius:999px;padding:13px 30px;font-size:18px;box-shadow:0 5px 0 #3d8a4d}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #3d8a4d}
  .status{align-self:center;background:#fffaf0e6;border-radius:999px;padding:4px 14px;font-size:14px}
  .status.retry,.status.novoice{background:#ffe7cf;color:#b55e12}
  .status.ok{background:var(--green);color:#fff;font-size:16px}
  .link{align-self:center;background:#fffaf0e6;border-radius:999px;padding:5px 14px;font-size:13px;text-decoration:underline}
  .row{display:flex;gap:10px;justify-content:center}
  .typing{gap:8px}
  .typing input{flex:1;min-width:0;border:3px solid var(--sun);border-radius:999px;padding:11px 16px;font:inherit;font-size:17px;color:inherit;outline:0;-webkit-user-select:text;user-select:text}
  .spin{width:44px;height:44px;border-radius:50%;border:6px solid #fffaf0;border-top-color:var(--red);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* —— 伙伴的气泡、对决时两边的格子 —— */
  /* —— 任务栏：电脑和平板一直展开，手机收成右上角的“任务”按钮 —— */
  #tasks{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(56px,calc(env(safe-area-inset-top) + 56px));width:min(290px,78vw);display:flex;flex-direction:column;gap:6px}
  .task{display:flex;align-items:center;gap:7px;width:100%;background:#fffaf0f0;border-radius:14px;padding:8px 9px 8px 10px;font-size:14px;line-height:1.3;text-align:left;box-shadow:0 3px 0 #0000001a}
  button.task:active{transform:translateY(2px);box-shadow:0 1px 0 #0000001a}
  .task em{flex:none;font-style:normal;font-size:16px}
  .task span{flex:1;min-width:0}
  .task b{flex:none;font-size:12px;background:#f1e7d3;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .task i{flex:none;font-style:normal;font-size:12px;background:var(--sun);border-radius:999px;padding:4px 10px;box-shadow:0 2px 0 #d9a52e}
  .task.main{border:2px solid #58bfe0}
  .task.done{background:#edfbe9;color:#3d8a4d;animation:taskdone 1.9s forwards}
  .task.done em{color:var(--green);font-weight:700}
  .task.done span{text-decoration:line-through}
  @keyframes taskdone{0%{transform:scale(.9)}12%{transform:scale(1.04)}20%,80%{transform:scale(1);opacity:1}100%{opacity:0}}
  #taskbtn{display:none}
  #menu #taskbtn{background:var(--sun);font-size:13px;opacity:1}
  #taskbtn.new{animation:tasknew .5s 2}
  @keyframes tasknew{50%{transform:translateY(-5px) scale(1.12)}}
  @media (max-width:700px){#taskbtn{display:block}#tasks{display:none;top:max(124px,calc(env(safe-area-inset-top) + 124px))}#tasks.open{display:flex}}
  body.talking #tasks{display:none}
  #botsay{position:absolute;transform:translate(-50%,-100%) scale(.6);background:#fff;border:3px solid #58bfe0;border-radius:18px;padding:8px 14px;font-size:15px;line-height:1.45;max-width:min(78vw,300px);box-shadow:0 4px 0 #0000001f;opacity:0;transition:.2s;pointer-events:none!important}
  #botsay.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
  #botsay:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:#58bfe0;border-bottom:0}
  #duel{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);width:min(96vw,600px);display:flex;gap:8px;align-items:stretch}
  #duel[hidden]{display:none}
  #duel .du{flex:none;background:var(--cream);border-radius:16px;padding:7px 12px;box-shadow:0 4px 0 #0000001f;display:flex;flex-direction:column;gap:5px;font-size:14px}
  #duel .du.r{align-items:flex-end}
  #duel .du span{display:flex;gap:4px}
  #duel i{width:17px;height:17px;border-radius:50%;background:#e3d6c4;transition:.25s}
  #duel i.bot{background:#58bfe0;box-shadow:inset 0 -3px 0 #3a9cc0}
  #duel i.foe{background:var(--red);box-shadow:inset 0 -3px 0 #b9462f}
  #duel .mid{flex:1;min-width:0;align-self:center;background:#4a3a2ecc;color:#fff;border-radius:999px;padding:7px 12px;font-size:14px;text-align:center}
  body.dueling #hud{display:none}
  /* —— 学习进阶：挖掉的词、藏起来的句子；句子本 —— */
  .gap{text-decoration:none;color:#e8862f;letter-spacing:-2px;margin:0 2px}
  .bigzh{display:block}
  .hid{display:block;color:#b9a892;font-size:.62em;margin-top:2px}
  .status .up{color:#ffe08a;margin-left:6px;letter-spacing:1px}
  #menu #bookbtn{background:#dff3fb;opacity:1}
  #book{position:absolute;inset:0;background:#4a3a2e66;display:grid;place-items:center;padding:16px;z-index:7}
  #book[hidden]{display:none}
  #book .box{position:relative;background:var(--cream);border-radius:26px;padding:20px 18px 16px;width:min(94vw,520px);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 8px 0 #00000022}
  #book h2{margin:0;font-size:24px;color:var(--red);text-align:center}
  #book .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#f1e7d3;font-size:20px;line-height:1}
  #book .bsum{margin:6px 0 0;text-align:center;font-size:15px}
  #book .bhelp{margin:6px 0 4px;text-align:center;font-size:12px;color:#8a7767}
  #book .blist{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:2px 2px 6px}
  #book h3{margin:12px 4px 6px;font-size:14px;color:#8a7767}
  .brow{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;width:100%;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:6px;text-align:left;box-shadow:0 3px 0 #0000001a}
  .brow .bs{grid-row:span 2;color:var(--sun);font-size:15px;letter-spacing:1px;text-shadow:0 1px 0 #d9a52e}.brow .bs i{color:#e3d6c4;font-style:normal;text-shadow:none}
  .brow .be{font-size:17px;line-height:1.3}
  .brow .bz{font-size:13px;color:#8a7767}
  .brow .bw{grid-column:2;font-size:12px;color:#8a7767;margin-top:3px}.brow .bw b{color:var(--ink);font-weight:600}
  .brow .bw i{font-style:normal;display:inline-block;margin-left:6px;background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 10px;font-weight:600;box-shadow:0 2px 0 #d9a52e}
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .witem{background:#fff;border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 #0000001a;border:3px solid transparent;font-size:14px}
  .witem.on{border-color:var(--sun)}
  .witem .sw{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 -4px 0 #00000022}
  .witem.none{opacity:.55}.witem.none .sw{background:#d9cfc0!important;display:grid;place-items:center;color:#fff;font-weight:700}
  .witem small{font-size:11px;color:#8a7767;text-align:center;line-height:1.3}
  .witem em{font-style:normal;font-size:11px;background:var(--sun);border-radius:999px;padding:0 8px}
  /* —— 开始画面和试麦 —— */
  #start{position:absolute;inset:0;background:#bfe8f7e6;display:grid;place-items:center;padding:20px;z-index:8}
  #start[hidden]{display:none}
  #start .box{background:var(--cream);border-radius:28px;padding:26px 26px 22px;width:min(92vw,420px);text-align:center;box-shadow:0 8px 0 #00000022;display:flex;flex-direction:column;gap:14px;align-items:center}
  #start h1{margin:0;font-size:30px;color:var(--red)}
  #start p{margin:0;font-size:16px;line-height:1.6}
  #start small{font-size:12px;color:#8a7767;line-height:1.6}
  #start .say{font-size:26px;background:#fff;border-radius:16px;padding:10px 22px;border:3px solid var(--sun)}
  #start .bar{width:100%;height:18px;border-radius:999px;background:#f1e7d3;overflow:hidden}
  #start .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .08s}
  #start .ok{color:var(--green);font-size:20px}
  body.talking #note,body.talking #talk,body.talking #menu>*:not(#bookbtn),body.talking:not(.starring) #bookbtn{display:none}
  #night{position:absolute;inset:0;background:#1d2548;opacity:0;transition:opacity .8s;display:grid;place-items:center;z-index:7;pointer-events:none!important}
  #night.on{opacity:1;pointer-events:auto!important}
  .daycard{background:#fffdf5;border:4px solid #ffd24d;border-radius:26px;padding:16px 38px 18px;text-align:center;box-shadow:0 7px 0 #0000003d;animation:su-in .4s cubic-bezier(.2,1.6,.4,1) both}
  .daycard small{display:block;font-size:15px;color:#8a7868}
  .daycard b{display:block;font-size:40px;color:#f26b3a;letter-spacing:2px;margin:2px 0}
  .daycard span{font-size:14px;color:#8a7868}
  .spark{text-shadow:0 2px 0 #0000001a;z-index:7}
  .starup{position:absolute;left:50%;top:27%;z-index:6;min-width:250px;max-width:86vw;padding:12px 26px 14px;border-radius:26px;background:#fffdf5;border:4px solid #ffd24d;box-shadow:0 7px 0 #0000002b;text-align:center;transform:translate(-50%,-50%);animation:su-in .34s cubic-bezier(.2,1.6,.4,1) both}
  .starup.out{animation:su-out .5s ease-in both}
  .starup.hit{animation:su-shake .3s ease-out}
  .starup.hit.out{animation:su-out .5s ease-in both}
  .su-rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px;border-radius:50%;z-index:-1;opacity:0;background:repeating-conic-gradient(#ffe27a66 0 12deg,#fff0 12deg 30deg);-webkit-mask:radial-gradient(#000 25%,#0000 68%);mask:radial-gradient(#000 25%,#0000 68%);animation:su-spin 7s linear infinite}
  .starup.hit .su-rays{opacity:.75;transition:opacity .3s}
  .starup.done .su-rays{width:820px;height:820px;margin:-410px}
  .starup.done.hit .su-rays{opacity:1}
  .su-t{font-size:20px;font-weight:900;color:#e58a00;letter-spacing:2px}
  .starup.done{border-color:#ffb300;background:linear-gradient(#fff8d6,#fffdf5 60%)}
  .starup.done .su-t{font-size:30px;color:#f26b3a;text-shadow:0 2px 0 #fff}
  .su-s{font-size:46px;line-height:1.15;letter-spacing:6px;margin:2px 0 4px}
  .starup.done .su-s{font-size:56px}
  .su-s b{display:inline-block;color:#e6dfd0;font-weight:400}
  .su-s b.on{color:#ffc21a;text-shadow:0 3px 0 #d98e00}
  .su-s b.new{color:#ffc21a;text-shadow:0 3px 0 #d98e00,0 0 22px #ffd24d;animation:su-star .62s cubic-bezier(.5,0,.6,1) both,su-pulse .7s .62s ease-in-out infinite alternate}
  .starup.first{padding:8px 20px 10px;border-width:3px;min-width:0;top:24%}
  .starup.first .su-t{font-size:14px;letter-spacing:0;color:#8a7868}
  .starup.first .su-s{font-size:28px}
  .starup.first .su-e{font-size:16px}
  .starup.first .su-z,.starup.first .su-rays{display:none}
  .su-e{font-size:19px;font-weight:800;color:#4a3a2e}
  .su-z{font-size:14px;color:#8a7868;margin-top:2px}
  .su-c{margin-top:8px;font-size:17px;font-weight:800;color:#d98a00;display:flex;align-items:center;justify-content:center;gap:6px}
  .tag.spot{background:#ffd24d;font-weight:800;font-size:17px;padding:4px 14px;animation:spotbob .9s infinite alternate ease-in-out}
  @keyframes spotbob{to{transform:translate(-50%,-118%)}}
  .su-n{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:99px;background:#ffb300;color:#fff;font-size:13px;font-weight:800}
  @keyframes su-in{from{transform:translate(-50%,-30%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  @keyframes su-out{to{transform:translate(-50%,-90%) scale(.7);opacity:0}}
  @keyframes su-shake{0%{transform:translate(-50%,-50%) scale(1.12)}40%{transform:translate(-50%,-46%) scale(.96)}100%{transform:translate(-50%,-50%) scale(1)}}
  @keyframes su-star{0%{transform:translateY(-70px) scale(5) rotate(-200deg);opacity:0}60%{transform:translateY(0) scale(.7) rotate(0);opacity:1}80%{transform:scale(1.5)}100%{transform:scale(1)}}
  @keyframes su-pulse{to{transform:scale(1.14)}}
  @keyframes su-spin{to{transform:rotate(360deg)}}
  @media (max-width:600px){#menu{max-width:46vw}#hud{max-width:48vw}#hud .day{display:none}.npcbox .line,.picked .en{font-size:20px}.card .en{font-size:18px}}
  #err{position:fixed;left:0;right:0;bottom:0;background:#b00020;color:#fff;font:12px/1.4 monospace;padding:6px 10px;white-space:pre-wrap;display:none;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="tags"></div>
  <button id="talk"></button>
  <div id="hud"></div>
  <div id="menu">
    <button class="pill" id="taskbtn"></button>
    <button class="pill" id="bookbtn"></button>
    <button class="pill" id="mode"></button>
    <button class="pill" id="quality"></button>
    <button class="pill" id="reset">重来</button>
  </div>
  <div id="tasks"></div>
  <div id="botsay"></div>
  <div id="duel" hidden></div>
  <div id="toast"></div>
